name: CI

on:
  pull_request:
  push: ~
  schedule:
    - cron: '0 0 * * *'

jobs:
  analyse:
    runs-on: ubuntu-latest
    env:
      PHP_CS_FIXER_IGNORE_ENV: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: none, curl, dom, iconv, mbstring, opcache, simplexml, tokenizer, xml, xmlwriter
          coverage: none

      - name: Install dependencies
        run: composer update --no-progress

      - name: Analyse
        run: composer analyse

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php-version: '7.4'
            composer_flags: '--prefer-lowest'
          - os: ubuntu-latest
            php-version: '7.4'
          - os: ubuntu-latest
            php-version: '8.0'
            composer_flags: '--prefer-lowest'
          - os: ubuntu-latest
            php-version: '8.0'
          - os: ubuntu-latest
            php-version: '8.1'
          - os: ubuntu-latest
            php-version: '8.2'
          - os: ubuntu-latest
            php-version: '8.3'
          - os: ubuntu-latest
            php-version: '8.4'
          - os: ubuntu-latest
            php-version: '8.5'
          - os: macos-latest
            php-version: '8.5'
          - os: windows-latest
            php-version: '8.5'

    name: PHP ${{ matrix.php-version }} (${{ matrix.os }}) ${{ matrix.composer_flags }}

    runs-on: ${{ matrix.os }}

    env:
      COMPOSER_PROCESS_TIMEOUT: 300

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: none, ctype, curl, dom, json, mbstring, opcache, openssl, tokenizer, xml, xmlwriter
          ini-values: opcache.enable_cli=1, opcache.file_cache=${{ runner.temp }}/opcache, opcache.file_cache_only=1
          coverage: none

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "COMPOSER_CACHE_DIR=${{ runner.temp }}\composer-cache" >> $env:GITHUB_ENV
          Add-MpPreference -ExclusionPath "${{ github.workspace }}", "${{ runner.temp }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "php.exe", "composer.bat" -ErrorAction SilentlyContinue

      - id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - run: composer update --no-progress ${{ matrix.composer_flags }}

      - run: vendor/bin/phpunit
